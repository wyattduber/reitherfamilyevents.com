<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reither Family Events</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2/dist/email.min.js"></script>
  <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script defer src="script.js"></script>
</head>
<body>
  <header>
    <h1>Reither Family Events</h1>
    <p>Celebrating moments together</p>
  </header>
  <nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#photos">Photos</a>
    <a href="#rsvp">RSVP</a>
  </nav>
  <div class="content" id="home">
    <h2>Welcome!</h2>
    <p>We are a family that loves to come together and celebrate. Stay tuned for upcoming events and memories from past ones.</p>
  </div>

  <div class="content" id="events">
    <h2>Upcoming Events</h2>
    <div id="events-list"></div>
  </div>

  <div class="content" id="photos">
    <h2>Photos</h2>
    <div class="photo-group">
      <details>
        <summary>Big Mac Day 2025</summary>
        <img src="photos/bigmacday2025/bigmac.jpg" width="200" />
      </details>
    </div>
  </div>

  <div class="content" id="rsvp">
    <h2>RSVP</h2>
    <form onsubmit="sendRSVP(event)">
      <label for="name">Name</label>
      <input type="text" name="name" required />

      <label for="email">Email</label>
      <input type="email" name="email" required />

      <label for="event">Event</label>
      <select name="event">
        <option>Big Mac Day 2025</option>
      </select>

      <label for="guests">Number of Guests</label>
      <input type="number" name="guests" min="1" />

      <label for="message">Message</label>
      <textarea name="message" rows="4"></textarea>

      <button type="submit">Send RSVP</button>
    </form>
  </div>
</body>
</html>
